name: Actualización Automática de Partidos FotMob

on:
  schedule:
    # Corre dos veces al día en horario diurno (evitando la madrugada para no despertar el servidor):
    # 13:00 UTC = 07:00 AM hora de Guatemala (GMT-6, previo a la jornada matutina)
    # 19:00 UTC = 01:00 PM hora de Guatemala (GMT-6, previo a la jornada vespertina/nocturna)
    - cron: '0 13,19 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente con 1 clic desde GitHub

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Extraer partidos de FotMob y calcular predicciones
        run: |
          python scraper_engine.py

      - name: Guardar y subir cambios a GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Actualización automática de partidos y horarios GT [skip ci]" && git push)

