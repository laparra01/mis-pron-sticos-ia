name: Keep Render Alive 24/7

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Endpoint
        run: |
          curl -s -f -m 30 "https://mis-pronosticos.onrender.com/api/ping" || echo "Ping enviado."
