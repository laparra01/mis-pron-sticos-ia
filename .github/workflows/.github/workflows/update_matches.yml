name: Actualización Automática de Partidos FotMob

on:
  schedule:
    # Corre dos veces al día:
    # 10:00 UTC = 04:00 AM hora de Guatemala (GMT-6)
    # 18:00 UTC = 12:00 PM (Mediodía) hora de Guatemala (GMT-6)
    - cron: '0 10,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Extraer partidos de FotMob y calcular predicciones
        run: |
          python scraper_engine.py

      - name: Guardar y subir cambios a GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Actualización automática de partidos y horarios GT [skip ci]" && git push)
